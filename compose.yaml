services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-levelup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-levelup_local}
      POSTGRES_DB: level_up_development
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - levelup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-levelup} -d level_up_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  levelup-postgres:
